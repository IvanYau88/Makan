[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "makan"
version = "0.1.0"
description = "An AI food agent built from scratch in Python."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "psycopg[binary]>=3.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/makan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests"]
