[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "makan"
version = "0.1.0"
description = "An AI food agent built from scratch in Python."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
overture = ["duckdb>=1.1"]
web = ["fastapi>=0.115", "uvicorn>=0.30", "pyjwt[crypto]>=2.8"]
postgres = ["psycopg[binary]>=3.2"]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "duckdb>=1.1",
    "psycopg[binary]>=3.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyjwt[crypto]>=2.8",
    "httpx2>=2",
]

# What the public Vercel site installs, pinned like requirements.txt, which a test keeps in step.
# Vercel installs from this file and ignores requirements.txt, and its `uv sync --no-dev` never
# installs an extra, but it does install the default groups. See docs/DESIGN.md, Vercel.
[dependency-groups]
public = [
    "httpx==0.28.1",
    "fastapi==0.142.2",
    "pyjwt[crypto]==2.15.1",
    "duckdb==1.5.6",
]

[tool.uv]
default-groups = ["public"]

[tool.hatch.build.targets.wheel]
packages = ["src/makan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests"]
