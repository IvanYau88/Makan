name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: makan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d makan_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MAKAN_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/makan_test

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development dependencies
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Check types
        run: mypy
      - name: Run tests including Postgres
        run: pytest

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install front end dependencies
        run: npm ci
      - name: Lint and check formatting
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Test the start scripts
        working-directory: .
        run: npm test
